<section class="gallery" id="materialGallery"><small>FIXED CAMERA / MATERIAL STUDY</small><h2 id="galleryTitle">透視 · AI 材質</h2><p>同一 CAD 視角的材質對照。AI 圖不是尺寸或接點證據；六個視角皆提供 AI 材質與 CAD 底圖對照。</p><nav id="galleryViews"></nav><nav><button id="aiMode" aria-pressed="true">AI 材質</button><button id="cadMode" aria-pressed="false">CAD 底圖</button></nav><p id="galleryNote" role="status"></p><a id="galleryLink" target="_blank"><img id="galleryImage" alt="固定視角 AI 與 CAD 對照"></a><p><a href="gallery/ai_prompts_all_v1.json">完整提示</a> · <a href="gallery/ai_manifest_all_v1.json">產圖來源與版本</a></p></section>
<style>.gallery{padding:28px 36px;border-top:1px solid #d6cbbd}.gallery img{display:block;width:100%;height:min(80vh,900px);object-fit:contain;background:#f4f0e8}.gallery nav{margin:12px 0}button[aria-pressed=true]{background:#5b4636;color:white}button:disabled{opacity:.4;cursor:not-allowed}</style>
<script>
(()=>{const labels={perspective:'透視',front:'正面',top:'俯視',structure:'承托結構',grip:'開孔細節',x_detail:'X 接合'};let active='perspective',mode='ai';
function show(){const available=true;if(!available)mode='cad';const src='gallery/'+(mode==='ai'?active+'_ai_square_v1.png':active+'_cad.png');document.getElementById('galleryImage').src=src;document.getElementById('galleryLink').href=src;document.getElementById('galleryTitle').textContent=labels[active]+' · '+(mode==='ai'?'AI 材質':'CAD 底圖');document.getElementById('aiMode').disabled=!available;document.getElementById('galleryNote').textContent=available?'AI 以此視角 CAD 為參考，局部細節仍可能偏移。':'此視角尚未生成 AI；目前顯示真實 CAD 底圖。';for(const m of ['ai','cad'])document.getElementById(m+'Mode').setAttribute('aria-pressed',mode===m);document.querySelectorAll('[data-gallery]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.gallery===active));}
for(const [id,label]of Object.entries(labels)){const b=document.createElement('button');b.textContent=label;b.dataset.gallery=id;b.onclick=()=>{active=id;show();document.dispatchEvent(new CustomEvent('d07-gallery-view',{detail:id}));};document.getElementById('galleryViews').append(b);}
for(const m of ['ai','cad'])document.getElementById(m+'Mode').onclick=()=>{mode=m;show();};show();})();
</script>
