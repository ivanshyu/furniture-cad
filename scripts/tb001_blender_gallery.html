<section class="gallery" id="materialGallery"><small>BLENDER BASE / AI MATERIAL STUDY</small><h2 id="galleryTitle">透視 · AI 渲染</h2><p>七個固定視角：Blender 底圖直接來自 FreeCAD 幾何；AI 依各張底圖重繪木紋與光影，可能存在細節偏差，不作尺寸依據。互動 CAD 位於上方。</p><nav id="galleryViews"></nav><nav><button id="aiMode" aria-pressed="true">AI 渲染</button><button id="blenderMode" aria-pressed="false">Blender 底圖</button></nav><a id="galleryLink" target="_blank"><img id="galleryImage" alt="固定視角的 AI 渲染與 Blender 底圖對照"></a><p><a href="TB001_D07_materials.blend">下載 Blender 場景</a> · <a href="gallery/blender_manifest.json">Blender 驗證記錄</a> · <a href="gallery/ai_prompts_blender_v1.json">AI 提示詞</a> · <a href="gallery/ai_blender_manifest_v1.json">AI 來源記錄</a></p></section>
<style>.gallery{padding:28px 36px;border-top:1px solid #d6cbbd}.gallery img{display:block;width:100%;height:min(80vh,900px);object-fit:contain;background:#f4f0e8}.gallery nav{margin:12px 0}button[aria-pressed=true]{background:#5b4636;color:white}</style>
<script>
(()=>{const labels={perspective:'透視',front:'正面',side:'側面',top:'俯視',bottom:'底部',structure:'承托結構',grip:'開孔細節'};let active='perspective',mode='ai';
function show(){const src='gallery/'+active+'_'+(mode==='ai'?'ai_v1':'blender')+'.png';document.getElementById('galleryImage').src=src;document.getElementById('galleryLink').href=src;document.getElementById('galleryTitle').textContent=labels[active]+' · '+(mode==='ai'?'AI 渲染':'Blender 底圖');document.getElementById('aiMode').setAttribute('aria-pressed',mode==='ai');document.getElementById('blenderMode').setAttribute('aria-pressed',mode==='blender');document.querySelectorAll('[data-gallery]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.gallery===active));}
for(const[id,label]of Object.entries(labels)){const b=document.createElement('button');b.textContent=label;b.dataset.gallery=id;b.onclick=()=>{active=id;show();document.dispatchEvent(new CustomEvent('d07-gallery-view',{detail:id}));};document.getElementById('galleryViews').append(b);}
document.getElementById('aiMode').onclick=()=>{mode='ai';show();};document.getElementById('blenderMode').onclick=()=>{mode='blender';show();};show();})();
</script>
